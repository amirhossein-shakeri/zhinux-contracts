syntax = "proto3";

package common.errors.v1;

option go_package = "github.com/amirhossein-shakeri/zhinux-contracts/gen/go/common/errors/v1;errorsv1";

// Standard error message structure
message Error {
  // Numeric error code
  int32 code = 1;

  // Human-readable error message
  string message = 2;

  // Additional error details
  map<string, string> details = 3;
}
