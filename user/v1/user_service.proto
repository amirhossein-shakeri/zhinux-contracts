// Package user.v1 defines the public user domain API.
//
// Stability:
//   - This package is stable and backward‑compatible within v1.
//   - Breaking changes require a new major version.
//
// Ownership:
//   - Team Identity Platform
//
// Consumers:
//   - User Service
//   - Admin Console
//   - Calendar & Reservation Service
//   - External Integrations

syntax = "proto3";

package user.v1;

import "user/v1/user_requests.proto";
import "user/v1/user_responses.proto";
// import "grpc/health/v1/health.proto";

option go_package = "github.com/amirhossein-shakeri/zhinux-contracts/gen/go/user/v1;userv1";

// UserService provides APIs for user lifecycle and retrieval.
service UserService {
  // CreateUser creates a new user record.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // GetUser fetches one user by supported identifier.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // ListUsers streams user list results with pagination metadata.
  rpc ListUsers(ListUsersRequest) returns (stream ListUsersStreamResponse);
}
