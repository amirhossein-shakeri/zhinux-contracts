syntax = "proto3";

package user.v1;

import "common/v1/metadata.proto";

option go_package = "github.com/amirhossein-shakeri/zhinux-contracts/gen/go/user/v1;userv1";

message User {
  common.metadata.v1.Metadata metadata = 1;
  string phone = 2;
  optional string name = 3;
  optional string username = 4;
  optional string email = 5;
}
