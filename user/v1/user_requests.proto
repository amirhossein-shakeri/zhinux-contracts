syntax = "proto3";

package user.v1;

import "common/v1/pagination.proto";

option go_package = "github.com/amirhossein-shakeri/zhinux-contracts/gen/go/user/v1;userv1";

// CreateUserRequest contains input for creating a user.
message CreateUserRequest {
  // phone is the user's required phone number.
  string phone = 1;

  // name is the user's optional display name.
  optional string name = 2;

  // username is the user's optional unique handle.
  optional string username = 3;

  // email is the user's optional email address.
  optional string email = 4;
}

// GetUserRequest contains selector input for fetching one user.
message GetUserRequest {
  // identifier selects how the user should be looked up.
  oneof identifier {
    // id fetches the user by unique identifier.
    string id = 1;

    // phone fetches the user by phone number.
    string phone = 2;

    // email fetches the user by email address.
    string email = 3;

    // username fetches the user by username.
    string username = 4;
  }
}

// ListUsersRequest contains paging input for listing users.
message ListUsersRequest {
  // pagination defines page and page size for list retrieval.
  common.pagination.v1.PaginationRequest pagination = 1;
}
