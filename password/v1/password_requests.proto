syntax = "proto3";

package password.v1;

import "password/v1/password.proto";

option go_package = "github.com/amirhossein-shakeri/zhinux-contracts/gen/go/password/v1;passwordv1";

// CreatePasswordRequest contains input for creating a password record.
message CreatePasswordRequest {
  // user_id identifies the user whose password is being stored.
  string         user_id         = 1;
  // password is the plaintext password to hash and store.
  string         password        = 2;
  // expires_at_unix is the optional expiration timestamp.
  optional int64 expires_at_unix = 3;
}

// ComparePasswordRequest contains input for password verification.
message ComparePasswordRequest {
  // identifier selects how the target password entry is located.
  oneof identifier {
    // user_id finds the password by owning user id.
    string user_id     = 1;
    // password_id finds the password by password record id.
    string password_id = 2;
  }
  // password is the plaintext password to compare.
  string password = 3;
}

// DeletePasswordRequest contains selector input for deletion.
message DeletePasswordRequest {
  // identifier selects which password entry should be deleted.
  PasswordSelector identifier = 1;
}

// ListPasswordsRequest contains filter input for listing passwords.
message ListPasswordsRequest {
  // user_id optionally filters passwords to one user.
  optional string user_id = 1;
}
