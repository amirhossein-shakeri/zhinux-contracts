syntax = "proto3";

package password.v1;

import "common/v1/pagination.proto";
import "password/v1/password.proto";

option go_package = "github.com/amirhossein-shakeri/zhinux-contracts/gen/go/password/v1;passwordv1";

// CreatePasswordResponse returns the identifier of the created record.
message CreatePasswordResponse {
  // id is the unique identifier of the created password record.
  string id = 1;
}

// ComparePasswordResponse indicates whether verification succeeded.
message ComparePasswordResponse {
  // is_valid is true when the provided password matches.
  bool is_valid = 1;
}

// ListPasswordsStreamResponse is one stream item for list responses.
message ListPasswordsStreamResponse {
  // payload contains either pagination metadata or one password item.
  oneof payload {
    // pagination is emitted for paging metadata in the stream.
    common.pagination.v1.PaginationResponse pagination = 1;
    // password is one password record in response-safe format.
    PasswordResponse                        password   = 2;
  }
}
