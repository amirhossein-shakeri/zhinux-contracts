syntax = "proto3";

package password.v1;

import "google/protobuf/empty.proto";
import "password/v1/password_requests.proto";
import "password/v1/password_responses.proto";
// import "grpc/health/v1/health.proto";

option go_package = "github.com/amirhossein-shakeri/zhinux-contracts/gen/go/password/v1;passwordv1";

// PasswordService manages password lifecycle and verification.
service PasswordService {
  // CreatePassword stores a new password entry for a user.
  rpc CreatePassword(CreatePasswordRequest) returns (CreatePasswordResponse);

  // ComparePassword verifies a provided password against stored credentials.
  rpc ComparePassword(ComparePasswordRequest) returns (ComparePasswordResponse);

  // DeletePassword removes one password entry.
  rpc DeletePassword(DeletePasswordRequest) returns (google.protobuf.Empty);

  // ListPasswords streams password entries with optional filtering.
  rpc ListPasswords(ListPasswordsRequest) returns (stream ListPasswordsStreamResponse);
}
