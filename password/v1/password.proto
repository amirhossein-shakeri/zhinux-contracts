syntax = "proto3";

package password.v1;

import "common/v1/metadata.proto";

option go_package = "github.com/amirhossein-shakeri/zhinux-contracts/gen/go/password/v1;passwordv1";

// Password stores password credentials for a user.
message Password {
  // metadata contains identity and audit timestamps.
  common.metadata.v1.Metadata metadata = 1;
  // user_id is the owner of this password record.
  string user_id = 2;
  // hashed_password is the securely hashed password value.
  string hashed_password = 3;
  // expires_at_unix is the optional expiration timestamp.
  optional string expires_at_unix = 4;
}

// PasswordResponse returns password data safe for API responses.
message PasswordResponse {
  // metadata contains identity and audit timestamps.
  common.metadata.v1.Metadata metadata = 1;
  // user_id is the owner of this password record.
  string user_id = 2;
  // expires_at_unix is the optional expiration timestamp.
  optional string expires_at_unix = 4;
}

// PasswordList wraps a collection of password records.
message PasswordList {
  // passwords is the list of returned password records.
  repeated Password passwords = 1;
}

// PasswordSelector identifies a password by id or owner user id.
message PasswordSelector {
  // identifier chooses which selector field is used.
  oneof identifier {
    // id is the unique identifier of a password record.
    string id = 1;
    // user_id selects a password record by owning user id.
    string user_id = 2;
  }
}
