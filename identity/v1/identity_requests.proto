syntax = "proto3";

package identity.v1;

option go_package = "github.com/amirhossein-shakeri/zhinux-contracts/gen/go/identity/v1;identityv1";

message LoginRequest {
  oneof credential {
    string id = 6;
    string phone = 3;
    string email = 4;
    string username = 5;
    string identifier = 1; // any of the above
  }
  string password = 2;
}
