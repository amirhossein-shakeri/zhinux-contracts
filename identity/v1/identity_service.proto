syntax = "proto3";

package identity.v1;

import "identity/v1/identity_requests.proto";
import "identity/v1/identity_responses.proto";
// import "grpc/health/v1/health.proto";

option go_package = "github.com/amirhossein-shakeri/zhinux-contracts/gen/go/identity/v1;identityv1";

// IdentityService provides identity and authentication operations.
service IdentityService {
  // Login authenticates a user by the provided credentials.
  rpc Login(LoginRequest) returns (LoginResponse);
}
