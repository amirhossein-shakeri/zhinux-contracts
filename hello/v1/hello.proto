syntax = "proto3";

package hello.v1;

// Go package path for generated code.
// This is the ONLY import path clients will use.
option go_package = "github.com/amirhossein-shakeri/zhinux-contracts/gen/go/hello/v1;hellov1";

// ---------------------------------------------
// Service: HelloService
// ---------------------------------------------
// Demonstrates all gRPC interaction patterns:
// - Unary
// - Server streaming
// - Client streaming
// - Bidirectional streaming
service HelloService {
  // SayHello sends a single greeting for one request. Unary RPC.
  rpc SayHello(SayHelloRequest) returns (SayHelloResponse);

  // StreamGreetings streams multiple greetings for one request. Server-side streaming RPC.
  rpc StreamGreetings(StreamGreetingsRequest) returns (stream StreamGreetingsResponse);

  // CollectGreetings receives a stream and returns one summary response. Client-side streaming RPC.
  rpc CollectGreetings(stream CollectGreetingsRequest) returns (CollectGreetingsResponse);

  // Chat establishes a bidirectional stream for live messages. Bidirectional streaming RPC.
  rpc Chat(stream ChatMessage) returns (stream ChatMessage);
}

// ---------------------------------------------
// Messages
// ---------------------------------------------
// SayHelloRequest is the input for the unary greeting RPC.
message SayHelloRequest {
  // name is the person to greet.
  string name = 1;
}

// SayHelloResponse is the output for the unary greeting RPC.
message SayHelloResponse {
  // message is the generated greeting text.
  string message = 1;
}

// --- Server streaming ---
// StreamGreetingsRequest requests multiple greetings.
message StreamGreetingsRequest {
  // name is the person to greet in each streamed message.
  string name = 1;
  // count is the number of greeting messages requested.
  int32 count = 2;
}

// StreamGreetingsResponse is one streamed greeting item.
message StreamGreetingsResponse {
  // message is the generated greeting text.
  string message = 1;
  // sequence is the 1-based order number of this greeting.
  int64 sequence = 2;
}

// --- Client streaming ---
// CollectGreetingsRequest is one item in the client stream.
message CollectGreetingsRequest {
  // message is one greeting entry sent by the client.
  string message = 1;
}

// CollectGreetingsResponse summarizes received client stream items.
message CollectGreetingsResponse {
  // total_received is the number of streamed messages accepted.
  int32 total_received = 1;
  // summary is an aggregated summary derived from streamed messages.
  string summary = 2;
}

// --- Bidirectional streaming ---
// ChatMessage is exchanged in both directions during chat.
message ChatMessage {
  // sender is the logical sender identity.
  string sender = 1;
  // message is the chat payload.
  string message = 2;
  // sent_at_unix_ms is the sender timestamp in Unix milliseconds.
  int64 sent_at_unix_ms = 3;
}
